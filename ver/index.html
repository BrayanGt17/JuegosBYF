<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Anime/Pelis - BYFFOREVER💗</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MRZTTZBHJH"></script>
    <script>

      function gtag(){dataLayer.push(arguments);}

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e1bee7;
            padding: 20px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(126, 87, 194, 0.5);
            color: #b39ddb;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(126, 87, 194, 0.3);
            transform: scale(1.05);
        }

        .header {
            text-align: center;
            margin: 30px 0;
        }

        .title {
            font-size: 2.5em;
            background: linear-gradient(90deg, #ff69b4, #ff1493, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(255, 105, 180, 0.5)); }
            to { filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8)); }
        }

        .subtitle {
            color: #b39ddb;
            margin-top: 10px;
            font-size: 1.1em;
        }

        .player-container {
            max-width: 900px;
            margin: 30px auto;
            background: linear-gradient(145deg, rgba(45, 45, 85, 0.95), rgba(25, 25, 55, 0.98));
            border: 2px solid rgba(126, 87, 194, 0.4);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            margin-top: 15px;
            text-align: center;
            color: #b39ddb;
        }

        .video-info h3 {
            color: #d1c4e9;
            margin-bottom: 5px;
        }

        .suggestion-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .suggestion-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.5);
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 0.5vmin;
            height: 0.5vmin;
            background: rgba(179, 157, 219, 0.6);
            border-radius: 50%;
            animation: float 15s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .content {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <a href="../" class="back-btn">← Menú</a>
    
    <div class="content">
        <div class="header">
            <h1 class="title">🎬 Ver Anime y Pelis 🎬</h1>
            <p class="subtitle">Pasala bien viendo lo que quieras 💕</p>
        </div>

        <div class="player-container">
            <div class="video-wrapper">
                <iframe src="https://playmogo.com/e/4mx06mjc0b9d" 
                        scrolling="no" 
                        frameborder="0" 
                        allowfullscreen="true"></iframe>
            </div>
            <div class="video-info">
                <h3>🎥 Reproductor</h3>
                <p>Disfruta de tu contenido favorito</p>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="https://wa.me/50238985289?text=Hola%20Brayan!%20Quiero%20sugerirte%20una%20pelicula%20o%20anime%20💕" 
               class="suggestion-btn" target="_blank">
                📺 Sugerir anime o película
            </a>
        </div>
    </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (10 + Math.random() * 15) + 's';
                particle.style.animationDelay = Math.random() * 15 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();
    </script>
</body>
</html>
