        /* ========== MANTENIMIENTO / MENSAJE ========== */
        .maintenance-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
            z-index: 9999;

            text-align: center;
            padding: 20px;
        }

        .maintenance-title {
            font-size: 3em;
            background: linear-gradient(90deg, #ff69b4, #ff1493, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }

        .maintenance-message {
            font-size: 1.5em;
            color: #d1c4e9;
            margin-bottom: 40px;
            max-width: 500px;
            line-height: 1.6;
        }

        .maintenance-hearts {
            font-size: 3em;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(255, 105, 180, 0.5)); }
            to { filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8)); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .whatsapp-btn {
            padding: 15px 40px;
            background: #25D366;
            color: white;
            border-radius: 30px;
            font-size: 1.2em;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
        }

        .whatsapp-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.6);
        }

        </div>

        <div class="player-container">
            <div class="video-wrapper">

                        allowfullscreen="true"></iframe>
            </div>
        </div>

        <div class="chapters-section">

            <div class="chapters-list" id="chaptersList">
                <button class="chapter-btn" data-url="https://playmogo.com/e/4mx06mjc0b9d" onclick="changeChapter(this, 'Inuyasha', 24)">
                    <div class="chapter-number">24</div>
                    <div class="chapter-label">Cap 24</div>
                </button>
                <button class="chapter-btn active" data-url="https://playmogo.com/e/9sdbsh34ekxx" onclick="changeChapter(this, 'Inuyasha', 25)">
                    <div class="chapter-number">25</div>
                    <div class="chapter-label">Cap 25</div>
                </button>
            </div>
        </div>

        <div style="text-align: center;">

                📺 Sugerir anime o película
            </a>
        </div>

    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (10 + Math.random() * 15) + 's';
                particle.style.animationDelay = Math.random() * 15 + 's';
                container.appendChild(particle);
            }
        }

        function changeChapter(btn, title, chapter) {
            const iframe = document.getElementById('videoFrame');
            iframe.src = btn.dataset.url;
            
            document.getElementById('currentTitle').textContent = title;
            document.getElementById('currentChapter').textContent = 'Sesión 1 - Capítulo ' + chapter + ' (Español Latino)';
            
            document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        createParticles();
    </script>
